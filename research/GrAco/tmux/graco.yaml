session_name: fast_livo2

environment:
  ROS_DIR: '/opt/ros/noetic'
  BAG_DIR: '/home/dbutterfield3/data/GrAco_dataset/V1.0/data'
  ROS_WS: '/home/dbutterfield3/fast_livo2_ws'
  ROBOT_NAME: 'ground-01'
  ROBOT_TYPE: 'ground'
options:
  default-command: /bin/bash

windows:
- window_name: main
  layout: even-horizontal
  panes:
  - shell_command:
    - source $ROS_DIR/setup.bash
    - source $ROS_WS/devel/setup.bash
    - cd $BAG_DIR/${ROBOT_NAME}/
    - sleep 12
    - rosbag play ${ROBOT_NAME}.bag
  - shell_command:
    - source $ROS_DIR/setup.bash
    - source $ROS_WS/devel/setup.bash
    - sleep 3
    - roslaunch fast_livo mapping_graco.launch robot_type:=${ROBOT_TYPE}

- window_name: roscore
  panes:
  - shell_command:
    - source $ROS_DIR/setup.bash
    - roscore

- window_name: kill
  layout: tiled
  panes:
  - tmux kill-session -t fast_livo2_